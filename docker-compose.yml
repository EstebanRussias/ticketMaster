services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo_root_pwd}
      MYSQL_DATABASE: billeterie
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-demo_app_pwd}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD:-demo_report_pwd}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongo_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-demo_mongo_root_pwd}
      MONGO_INITDB_DATABASE: ticketmaster
      MONGO_DB: ticketmaster
      MONGO_APP_USER: ${MONGO_APP_USER:-ticket_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-demo_mongo_app_pwd}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/init-nosql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1})' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Job ponctuel : peuple MongoDB a partir des evenements / billets MySQL
  seed:
    build: ./api
    command: ["node", "scripts/seed-mongo.js"]
    restart: "no"
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
    environment: &api-env
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASSWORD: ${APP_DB_PASSWORD:-demo_app_pwd}
      DB_NAME: billeterie
      MONGO_URL: mongodb://${MONGO_APP_USER:-ticket_app}:${MONGO_APP_PASSWORD:-demo_mongo_app_pwd}@mongo:27017/ticketmaster
      MONGO_DB: ticketmaster
      SESSION_SECRET: ${SESSION_SECRET:-demo_session_secret}
      PORT: 3000

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      seed: { condition: service_completed_successfully }
    environment: *api-env
    ports:
      - "3000:3000"

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  mongo_data:
